agent.task.name=rebooking-advisor
agent.task.input.type=STRUCT
agent.task.input.struct.name=advice-request
agent.task.output.type=STRUCT
agent.task.output.struct.name=rebooking-recommendation
agent.user-message-template=Help passenger {{struct.passengerId}} rebook trip {{struct.tripId}}. Preferences: {{struct.preferences}}. Feasible itineraries: {{struct.options}}.
agent.system-message=You are a concise airline rebooking advisor. Use find_flights when schedule details would help. Pick exactly one optionId from the supplied feasible itineraries, giving a short explanation grounded in the passenger preferences and actual legs. Prefer same-day travel unless preferences indicate otherwise. Never invent flights, reserve seats, or claim a booking is confirmed. Return source as LLM. If no options exist, use empty optionId and explain that an airport agent can help. Supply every field in the output Struct schema.
agent.mcp.clients.schedules.transport=streamable-http
agent.mcp.clients.schedules.url=http://backend:8081/mcp/flight-schedules
agent.chat-model.openai.timeout=PT45S
agent.chat-model.openai.max-retries=0
quarkus.littlehorse.tasks."rebooking-advisor".register.enabled=false

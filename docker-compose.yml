services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: c2VydmljZS1vcHMtZGVtbw
    ports:
      - "19092:19092"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 5s
      timeout: 5s
      retries: 20

  littlehorse:
    build:
      context: .
      dockerfile: littlehorse.Dockerfile
      args:
        LITTLEHORSE_VERSION: ${LITTLEHORSE_VERSION}
    image: lh-demo-motive-littlehorse:${LITTLEHORSE_VERSION}
    environment:
      LHS_LISTENERS: EXTERNAL:2023,INTERNAL:2024
      LHS_ADVERTISED_LISTENERS: EXTERNAL://localhost:2023,INTERNAL://littlehorse:2024
      LHS_LISTENERS_PROTOCOL_MAP: EXTERNAL:PLAIN,INTERNAL:PLAIN
      LHS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LHS_CLUSTER_ID: service-operations-demo
      LHS_INSTANCE_ID: "1"
      LHS_SHOULD_CREATE_TOPICS: "true"
      LHC_API_HOST: localhost
      LHC_API_PORT: 2024
      LHC_TENANT_ID: default
    ports:
      - "2023:2023"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/lhctl", "whoami"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    image: ghcr.io/littlehorse-enterprises/littlehorse/lh-dashboard:master
    environment:
      LHC_API_HOST: littlehorse
      LHC_API_PORT: 2024
      LHC_OAUTH_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      littlehorse:
        condition: service_healthy

  kafka-connect:
    image: apache/kafka:${KAFKA_VERSION}
    command: ["/opt/kafka/bin/connect-distributed.sh", "/etc/kafka/connect-distributed.properties"]
    ports:
      - "8083:8083"
    volumes:
      - ./plugins/lh-kafka-connect:/usr/local/share/kafka/plugins/lh-kafka-connect:ro
      - ./connect-distributed.properties:/etc/kafka/connect-distributed.properties:ro
    depends_on:
      backend:
        condition: service_healthy
      littlehorse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      LHC_API_HOST: littlehorse
      LHC_API_PORT: 2024
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      littlehorse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/api/outcomes >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

quarkus.http.port=8081
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Idempotency-Key
quarkus.jackson.fail-on-unknown-properties=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:airline}
quarkus.datasource.password=${POSTGRES_PASSWORD:airline}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/airline}
quarkus.datasource.devservices.enabled=false
lhc.api.host=${LHC_API_HOST:localhost}
lhc.api.port=${LHC_API_PORT:2023}
lhc.tenant.id=default
quarkus.littlehorse.tasks."rebooking-advisor".start.enabled=${RULES_ADVISOR_ENABLED:true}
demo.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
demo.streams.state-dir=${STREAMS_STATE_DIR:/tmp/airline-streams}
demo.execution-topic=${LH_EXECUTION_TOPIC:connection-rescue_default_execution}
airline.response-seconds=${RESPONSE_SECONDS:180}
